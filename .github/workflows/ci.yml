name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only deps for lint + logic tests
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest numpy soundfile librosa platformdirs
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e . --no-deps
      - name: Lint
        run: ruff check src/ launcher/ tests/
      - name: Test (CPU-only, model-free logic tests)
        run: pytest tests/ -v
