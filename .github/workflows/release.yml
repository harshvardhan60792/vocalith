name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # allow a manual test run before trusting a real tag

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell -File launcher/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Vocalith-win64
          path: dist/Vocalith-win64.zip

  macos:
    runs-on: macos-14  # arm64
    steps:
      - uses: actions/checkout@v4
      - run: bash launcher/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Vocalith-macos-arm64
          path: dist/Vocalith-macos-arm64.tar.gz

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash launcher/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Vocalith-linux-x86_64
          path: dist/Vocalith-linux-x86_64.tar.gz

  publish:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          cd artifacts
          find . -type f -exec sha256sum {} \; > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
