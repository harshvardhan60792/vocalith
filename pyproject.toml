[project]
name = "vocalith"
version = "0.1.0"
description = "Free, local, open-source desktop audio toolkit: TTS, voice cloning, voice isolation, dubbing."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

dependencies = [
  # torch trio pinned to versions confirmed mutually compatible on Kaggle P100
  # (2026-09-04 spike run) -- see kaggle/results/README.md for the failure this avoids.
  "torch==2.6.0",
  "torchvision==0.21.0",
  "torchaudio==2.6.0",
  "kokoro==0.9.4",
  "misaki[en]",
  "chatterbox-tts",
  "demucs",
  "openai-whisper",
  "transformers>=4.44",
  "sentencepiece",           # required by Opus-MT / M2M100 tokenizers
  "soundfile",
  "librosa",
  "numpy<2.0",               # demucs/numba compatibility
  "platformdirs",
  "huggingface_hub",
  "gradio>=4.44",
  "ffmpeg-python",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# vendored fonts/anime.js for the UI (design.py inlines these at runtime) -- not .py
# files, so setuptools won't include them by default. See src/vocalith/ui/design.py.
vocalith = ["ui/static/fonts/*.woff2", "ui/static/js/*.js"]

[tool.ruff]
line-length = 100
target-version = "py310"
