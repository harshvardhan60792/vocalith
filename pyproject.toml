[project]
name = "vocalith"
version = "0.1.0"
description = "Free, local, open-source desktop audio toolkit: TTS, voice cloning, voice isolation, dubbing."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

dependencies = [
  # torch trio pinned to versions confirmed mutually compatible on Kaggle P100
  # (2026-09-04 spike run) -- see kaggle/results/README.md for the failure this avoids.
  "torch==2.6.0",
  "torchvision==0.21.0",
  "torchaudio==2.6.0",
  "kokoro==0.9.4",
  "misaki[en]",
  "chatterbox-tts",
  "demucs",
  "openai-whisper",
  "transformers>=4.44",
  "sentencepiece",           # required by Opus-MT / M2M100 tokenizers
  "soundfile",
  "librosa",
  "numpy<2.0",               # demucs/numba compatibility
  "platformdirs",
  "huggingface_hub",
  "gradio>=4.44",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# vendored anime.js for the UI (design.py inlines it at runtime) -- not a .py file,
# so setuptools won't include it by default. See src/vocalith/ui/design.py.
vocalith = ["ui/static/js/*.js"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly rather than accepting whatever a given ruff version's default
# expands to (a ruff bump silently widening this and breaking CI is the same class
# of surprise as the unpinned-transformers-version bug found earlier tonight).
# E/F/I: pycodestyle errors, pyflakes, import sorting -- catches real bugs and
# genuine mess. Deliberately NOT pylint-refactor/bandit-security/pyupgrade-style
# rules, which are opinions, not correctness, and weren't part of this project's
# actual quality bar.
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# gr.Progress() as a default argument is Gradio's own documented API for wiring
# progress bars -- not a bug B008 would otherwise (correctly, in general) flag.
"src/vocalith/ui/app.py" = ["B008"]
